[build]
  publish = "."

[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/*.framercms"
  [headers.values]
    Content-Type = "application/octet-stream"

[[headers]]
  for = "/assets/*.framercms"
  [headers.values]
    Content-Type = "application/octet-stream"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/keepit.html"
  to = "/case-studies/keepit/"
  status = 301

[[redirects]]
  from = "/google-transtale.html"
  to = "/case-studies/google-transtale/"
  status = 301

[[redirects]]
  from = "/rislly.html"
  to = "/case-studies/rislly/"
  status = 301

[[redirects]]
  from = "/opnr.html"
  to = "/case-studies/opnr/"
  status = 301

[[redirects]]
  from = "/girintec.html"
  to = "/case-studies/girintec/"
  status = 301

[[redirects]]
  from = "/what-is-an-experience.html"
  to = "/blog/what-is-an-experience/"
  status = 301
